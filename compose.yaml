services:
  whoop-dev:
    build:
      context: .
      args:
        USER_ID: "${LOCAL_UID:-1000}"
        GROUP_ID: "${LOCAL_GID:-1000}"
    working_dir: /workspace/skills/whoop
    stdin_open: true
    tty: true
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - .:/workspace
      - whoop-config:/home/developer/.config/whoop

  dashboard-dev:
    image: node:22-bookworm-slim
    working_dir: /workspace/dashboard
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    init: true
    environment:
      WELLNESS_ENABLE_LOCAL_AUTH: "true"
      WELLNESS_ALLOWED_EMAILS: "local@example.test"
      WELLNESS_DEV_USER_EMAIL: "local@example.test"
      WELLNESS_DEV_USER_ID: "local-owner"
      WELLNESS_DEV_USER_NAME: "Local household owner"
      WELLNESS_DATA_MODE: "mock"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/workspace

volumes:
  whoop-config:
